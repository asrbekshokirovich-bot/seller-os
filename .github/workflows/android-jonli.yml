# Android ilova — saytdagi bogʻlanish (jonli).
#
# Ilova manzil satrisiz ochilishi uchun sayt `/.well-known/assetlinks.json`
# da ilova paketini va imzo kaliti izini eʼlon qilishi SHART. Fayl yoʻqolsa
# yoki iz farq qilsa, ilova yiqilmaydi — jimgina oddiy brauzer oynasiga
# aylanadi (tepada manzil satri) va buni hech kim sezmaydi (QOIDALAR.md §8).
#
# Tekshiradi:
#   1) jonli faylda paket va izlar `apps/android/twa-manifest.json` bilan aynan bir xil;
#   2) Google Digital Asset Links API har iz uchun «linked» deydi — telefon
#      aynan shu natijaga qaraydi.
name: Android — sayt bogʻlanishi

on:
  workflow_dispatch:
  schedule:
    - cron: '23 4 * * *' # har kuni 09:23 (Toshkent)
  push:
    branches: [main]
    paths:
      - 'apps/web/public/.well-known/**'
      - 'apps/android/twa-manifest.json'
      - '.github/workflows/android-jonli.yml'

permissions:
  contents: read

jobs:
  jonli:
    name: assetlinks.json va Google tekshiruvi
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Tekshirish
        run: |
          python3 - <<'PY'
          import json, sys, time, urllib.parse, urllib.request

          t = json.load(open('apps/android/twa-manifest.json'))
          sayt = 'https://' + t['host']
          paket = t['packageId']
          izlar = sorted(f['value'] for f in t['fingerprints'])

          def ol(url):
              sorov = urllib.request.Request(url, headers={'User-Agent': 'zumsavdo-ci'})
              with urllib.request.urlopen(sorov, timeout=30) as r:
                  return r.status, r.headers.get('Content-Type', ''), r.read()

          # Sayt main'ga merge'dan 1–3 daqiqa keyin chiqadi — qayta urinish.
          xato = None
          for urinish in range(10):
              try:
                  holat, tur, tana = ol(sayt + '/.well-known/assetlinks.json')
                  topildi = [s for s in json.loads(tana)
                             if s.get('target', {}).get('package_name') == paket]
                  bor = sorted(topildi[0]['target']['sha256_cert_fingerprints']) if topildi else []
                  if holat == 200 and 'json' in tur and bor == izlar:
                      print(f"assetlinks.json: {holat} {tur}; paket {paket}; izlar mos ({len(izlar)} ta)")
                      xato = None
                      break
                  xato = f"holat {holat}, tur {tur}, izlar {bor}"
              except Exception as e:
                  xato = repr(e)
              print(f"{urinish + 1}-urinish: {xato}")
              time.sleep(30)
          if xato:
              print(f"::error::Saytdagi assetlinks.json mos emas: {xato}")
              sys.exit(1)

          # Google — telefon tekshiradigan manba.
          for iz in izlar:
              q = urllib.parse.urlencode({
                  'source.web.site': sayt,
                  'relation': 'delegate_permission/common.handle_all_urls',
                  'target.android_app.package_name': paket,
                  'target.android_app.certificate.sha256_fingerprint': iz,
              })
              _, _, tana = ol('https://digitalassetlinks.googleapis.com/v1/assetlinks:check?' + q)
              javob = json.loads(tana)
              if not javob.get('linked'):
                  print(f"::error::Google: {iz[:11]}… bogʻlanmagan — {javob}")
                  sys.exit(1)
              print(f"Google Digital Asset Links: {iz[:11]}… — linked")
          PY
