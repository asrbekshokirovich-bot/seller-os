# CI — merge darvozasi.
#
# QOIDALAR.md, 5-bo'lim: "Merge sharti — CI yashil: lint + testlar +
# tuzoq 100% + eval ≥90%".
#
# Tuzoq va eval testlari B1/B2 da qo'shiladi (hozir ular uchun ma'lumot
# yo'q). Ular qo'shilganda shu faylga qadam bo'lib tushadi.
name: CI

on:
  push: { branches: [main] }
  pull_request:

jobs:
  node:
    name: Node — typecheck va testlar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npx vitest run

      # Testi bor, lekin hech kim chaqirmaydigan kodni topadi.
      # 2026-08-24 da shunday ikkita holat topilgan edi va ikkalasida
      # ham testlar yashil turgan: test funksiyani OʻZI chaqiradi,
      # shuning uchun "hech kim chaqirmaydi" degan holat testda ham
      # yashil koʻrinadi (QOIDALAR.md §8, 4-qoida).
      - name: Oʻlik kod yoʻqmi
        run: npm run olik-kod
      # Edge Function nusxasi manbadan ajralib ketmasin. Ikki nusxa
      # boʻlgan joyda ular albatta bir kun farq qiladi va buni hech kim
      # sezmaydi — aynan shu naqshdan qochamiz.
      - name: Edge Function nusxasi manbaga mos
        run: node supabase/functions/tayyorlash.mjs --tekshir

  python:
    name: Python — skreyper testlari
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: apps/scraper }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install -e '.[dev]'
      - run: python -m pytest -q

  hujjat:
    name: Hujjatlar joyida
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Manba-haqiqat fayllari yo'qolib qolmasin. Ular yo'q bo'lsa agent
      # keyingi sessiyada kontekstsiz qoladi va mantiqni qaytadan
      # o'ylab topa boshlaydi.
      - name: Manba-haqiqat fayllari bormi
        run: |
          for f in QOIDALAR.md SXEMA.md FORMULA.md TUZOQLAR.md BACKLOG.md; do
            test -f "$f" || { echo "::error::$f yo'q"; exit 1; }
          done
          echo "Hammasi joyida."

      # Sir qidiruvi. Kalit omborga tushsa, uni o'chirish yetarli emas —
      # git tarixida qolib ketadi va almashtirish kerak bo'ladi.
      - name: Sir omborga tushmaganmi
        run: |
          # Naqsh kalitning OʻZINI qidiradi, "sb_secret_" degan soʻzni emas.
          # Avvalgi naqsh prefiksning oʻziga qanoat qilardi va shu sababli
          # xavfsizlik hujjatidagi `sb_secret_...` jadvalini ushlab, CI ni
          # qizartirgan edi. Haqiqiy kalitda prefiksdan keyin uzun
          # [A-Za-z0-9_-] qatori keladi; hujjatdagi nuqtalar unga tushmaydi.
          NAQSH="(sb_secret_[A-Za-z0-9_-]{12,}|SUPABASE_SERVICE_ROLE_KEY[[:space:]]*=[[:space:]]*[A-Za-z0-9])"

          # Naqsh haqiqatan otadimi — har yugurishda tekshiriladi.
          # Aks holda buzilgan naqsh "sir topilmadi" deb jimgina yashil
          # beraverardi, bu esa tekshiruvsizlikdan battar (QOIDALAR.md §8).
          SOXTA="sb_secret_$(printf 'A%.0s' $(seq 20))"
          if ! printf '%s\n' "$SOXTA" | grep -qE "$NAQSH"; then
            echo "::error::Sir qidiruvchi naqsh ishlamayapti — soxta kalitni ham topmadi."
            exit 1
          fi
          echo "Naqsh soxta kalitni topdi — qorovul tirik."

          if git grep -nIE "$NAQSH" -- ':!*.example' ':!.github/workflows/*'; then
            echo "::error::Omborda sirga o'xshash matn topildi."
            exit 1
          fi
          echo "Sir topilmadi."
