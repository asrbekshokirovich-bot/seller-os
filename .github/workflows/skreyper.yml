# SellerOS oʻlchovi — kuniga uch marta.
#
# Nima oʻlchanadi. `selleros.tracked_product` — 300 turkumdan 20 tadan,
# 6 000 tovar. Roʻyxat turkum boʻyicha MUVOZANATLI: har turkumda talab
# oraligʻi 20 boʻlakka boʻlinib, har boʻlakdan bitta olinadi. Sabab
# `supabase/migrations/0013` da yozilgan — faqat eng koʻp
# sotiladiganlarni olsak, turkum medianasi shishadi va "medianadan 3
# barobar koʻp sotadi" degan shart hech qachon bajarilmaydi.
#
# Nega kuniga uch marta. Sotuv `greatest(0, prev_stock - stock)` bilan
# hisoblanadi. Bitta oʻlchovda kun ichidagi toʻldirish sotuvni
# yashiradi. Uchta oʻlchov `certainty: yuqori` beradi.
#
# Nega bu soatlarda. Zumsavdo sweepi 02, 10, 18 UTC da ~1 soat
# ishlaydi. Bular 04, 12, 20 UTC — ustma-ust tushmaydi, yaʼni Uzumga
# bir vaqtda ikki tomondan soʻrov bormaydi.
name: Skreyper (SellerOS)

on:
  schedule:
    # UTC. Toshkent = UTC+5, yaʼni 09:00, 17:00, 01:00.
    - cron: "0 4,12,20 * * *"
  workflow_dispatch:

concurrency:
  group: skreyper
  cancel-in-progress: false

jobs:
  olchash:
    runs-on: ubuntu-latest
    # 6 000 tovar ~1,1 tovar/sek bilan ~1,5 soat. Zaxira bilan.
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Sir borligini tekshirish
        run: |
          if [ -z "${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" ]; then
            echo "::error::SUPABASE_SERVICE_ROLE_KEY yoʻq."
            exit 1
          fi
          if [ -z "${{ secrets.SUPABASE_URL }}" ]; then
            echo "::error::SUPABASE_URL yoʻq."
            exit 1
          fi

      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }

      - run: pip install -e '.[dev]'
        working-directory: apps/scraper

      - name: Oʻlchash
        working-directory: apps/scraper
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python -m selleros_scraper --kuzatuv --stok

      # "Ishladi" degani "oʻlchadi" degani emas. Skreyper xatosiz tugab
      # nol qator yozishi mumkin edi — bunday holat yashil boʻlib
      # koʻrinardi va hech kim sezmasdi (QOIDALAR.md §8).
      - name: Haqiqatan oʻlchandimi
        env:
          URL: ${{ secrets.SUPABASE_URL }}
          KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          # `public.so_olchov_soni` orqali soʻraladi, jadvalga
          # toʻgʻridan-toʻgʻri emas: `selleros` sxemasi PostgREST da
          # ochiq boʻlmasligi mumkin va u holda tekshiruv 404 olib,
          # xatoni "oʻlchov yoʻq" deb koʻrsatardi — yaʼni notoʻgʻri
          # sababni aytardi.
          javob=$(curl -sS --max-time 30 -X POST \
            -H "apikey: $KEY" -H "Authorization: Bearer $KEY" \
            -H "Content-Type: application/json" -d '{}' \
            "$URL/rest/v1/rpc/so_olchov_soni")
          echo "$javob"
          n=$(printf '%s' "$javob" | sed -n 's/.*"olchov"[[:space:]]*:[[:space:]]*\([0-9]*\).*/\1/p')
          if [ -z "$n" ] || [ "$n" -eq 0 ]; then
            echo "::error::Skreyper xatosiz tugadi, lekin bugun bitta ham oʻlchov yozilmadi."
            exit 1
          fi
          echo "Bugun $n ta oʻlchov yozildi."

      # 2-qadam nomzodlarini qayta hisoblash.
      #
      # NEGA SHU YERDA. Hisob 35 soniya ketadi va perepis maʼlumotiga
      # tayanadi — yaʼni uni har soʻrovda qilishning maʼnosi yoʻq.
      # Ilgari `/yonalishlar` aynan shuni har chaqiruvda bajarardi va
      # **25 soniyada** javob berardi.
      #
      # Skreyper bilan birga, chunki ikkalasi ham bir xil roʻyxatga
      # (`tracked_product`) tayanadi: kuzatuv oʻzgarsa, kesh ham
      # oʻsha zahoti oʻzgarishi kerak.
      #
      # `if: always()` — oʻlchov qismi yiqilsa ham kesh yangilanadi.
      # Kechagi keshni bugungi nosozlik tufayli eskitib yuborish
      # foydalanuvchiga hech qanday foyda bermaydi.
      - name: Yoʻnalish keshini yangilash
        if: always()
        env:
          URL: ${{ secrets.SUPABASE_URL }}
          KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          javob=$(curl -sS --max-time 320 -X POST \
            -H "apikey: $KEY" -H "Authorization: Bearer $KEY" \
            -H "Content-Type: application/json" -d '{}' \
            "$URL/rest/v1/rpc/so_yonalish_yangila")
          echo "$javob"
          n=$(printf '%s' "$javob" | sed -n 's/.*"yozildi"[[:space:]]*:[[:space:]]*\([0-9]*\).*/\1/p')
          # Nol qator "turkum yoʻq" degani, "yangilandi" degani emas.
          # Bunday holat yashil boʻlib koʻrinardi va kesh jimgina
          # eskirib borardi (QOIDALAR.md §8).
          if [ -z "$n" ] || [ "$n" -eq 0 ]; then
            echo "::error::Kesh yangilanmadi — bitta ham turkum yozilmadi."
            exit 1
          fi
          echo "Keshda $n ta turkum yangilandi."

      # Sotuv baholash — qoldiq farqidan.
      #
      # NEGA SHU YERDA. `so_rollup_sales` yozilgan va ishlaydi, lekin
      # uni HECH KIM CHAQIRMASDI: `sales_estimates` bugungacha 0 qator
      # edi. Qoʻlda chaqirilganda darhol 6 186 qator yozdi.
      #
      # Yaʼni sotuv baholash kodi bor, testi bor, hujjatda "tayyor"
      # deb turadi — va bironta raqam hisoblanmagan. QOIDALAR.md
      # §8 dagi naqshning oʻzi.
      #
      # Oʻlchovdan KEYIN chaqiriladi: yangi qoldiq yozilmaguncha
      # hisoblaydigan farq yoʻq.
      - name: Sotuvni hisoblash
        if: always()
        env:
          URL: ${{ secrets.SUPABASE_URL }}
          KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          bugun=$(date -u -d '+5 hours' +%F)
          kecha=$(date -u -d '+5 hours -3 days' +%F)
          javob=$(curl -sS --max-time 320 -X POST \
            -H "apikey: $KEY" -H "Authorization: Bearer $KEY" \
            -H "Content-Type: application/json" \
            -d "{\"p_from\":\"$kecha\",\"p_to\":\"$bugun\"}" \
            "$URL/rest/v1/rpc/so_rollup_sales")
          echo "$javob"
          n=$(printf '%s' "$javob" | sed -n 's/.*"yozildi"[[:space:]]*:[[:space:]]*\([0-9]*\).*/\1/p')
          # Nol qator "sotuv yoʻq" degani EMAS — "hisoblanmadi" degani.
          # Ikkalasi bir xil koʻrinmasligi kerak.
          if [ -z "$n" ] || [ "$n" -eq 0 ]; then
            echo "::error::Sotuv baholanmadi — bitta ham qator yozilmadi."
            exit 1
          fi
          echo "$n ta sotuv bahosi yozildi."

      # Tuzoq bayroqlarini qayta hisoblash.
      #
      # NEGA SHU YERDA. Filtrlar har soʻrovda xotirada ishlaydi va
      # natijasi saqlanmasdi: `product_flags` jadvali rejada bor,
      # bazada esa 0 qator edi. Yaʼni "shu tovar qachondan beri
      # bayroqli" degan savolga javob yoʻq edi.
      #
      # Oʻlchovdan KEYIN: yangi narx va qoldiq yozilmaguncha
      # bayroqlar oʻzgarmaydi.
      - name: Tuzoq bayroqlarini hisoblash
        if: always()
        env:
          URL: ${{ secrets.SUPABASE_URL }}
          KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          API: https://duequijnnzcngzzvjqst.supabase.co/functions/v1/selleros
        run: |
          javob=$(curl -sS --max-time 300 -X POST \
            -H "Authorization: Bearer $KEY" \
            -H "Content-Type: application/json" -d '{}' \
            "$API/bayroqlarni-hisobla")
          echo "$javob"
          n=$(printf '%s' "$javob" | sed -n 's/.*"tekshirildi"[[:space:]]*:[[:space:]]*\([0-9]*\).*/\1/p')
          # Nol tovar tekshirilgani "tuzoq yoʻq" degani EMAS.
          if [ -z "$n" ] || [ "$n" -eq 0 ]; then
            echo "::error::Bayroqlar hisoblanmadi — bitta ham tovar tekshirilmadi."
            exit 1
          fi
          echo "$n ta tovar tekshirildi."
