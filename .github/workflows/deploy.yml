# Staging deploy — B0 darvozasi.
#
# Reja B0 darvozasi: "bo'sh loyiha staging'da AVTOMATIK deploy".
# Qo'lda joylash bu shartni bajarmaydi: qo'lda qilingan ish bir kun
# esdan chiqadi va staging jimgina eskiradi.
#
# Nega Supabase Edge Function. Backend mantiqi (`tahlil.ts`, `sifat.ts`)
# Fastify'ga bog'lanmagan — sof TypeScript. Shuning uchun alohida
# hosting hisobi kerak emas, Supabase esa allaqachon bor.
name: Deploy (staging)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  # Ketma-ket deploylar bir-birini bosib ketmasin.
  group: deploy-staging
  cancel-in-progress: false

jobs:
  edge:
    name: Edge Function → staging
    runs-on: ubuntu-latest
    env:
      PROJECT_REF: duequijnnzcngzzvjqst
    steps:
      - uses: actions/checkout@v4

      # Sir yo'q bo'lsa JIMGINA o'tib ketmaydi. Darvoza "avtomatik
      # deploy" ni talab qiladi; deploy bo'lmasa, u bajarilmagan.
      # QOIDALAR.md, 8-bo'lim: jim o'lim taqiqlanadi.
      - name: Sir borligini tekshirish
        run: |
          if [ -z "${{ secrets.SUPABASE_ACCESS_TOKEN }}" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN yo'q."
            echo "Qo'shish: GitHub → Settings → Secrets and variables →"
            echo "Actions → New repository secret."
            echo "Qiymat: supabase.com/dashboard/account/tokens da yasaladi."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci

      # Nusxa manbadan ajralib ketmasin — CI da ikkinchi marta tekshiriladi.
      - name: Edge Function nusxasi manbaga mos
        run: node supabase/functions/tayyorlash.mjs --tekshir

      # VERSIYA QOTIRILGAN — `latest` EMAS.
      #
      # `version: latest` har yugurishda GitHub API dan oxirgi relizni
      # soʻraydi. Yugurish anonim, yaʼni soatiga 60 ta soʻrov —
      # umumiy runner IP lari uni tez toʻldiradi.
      #
      # Oʻlchandi 2026-09-02 13:01: deploy shu bilan yiqildi —
      #
      #   ##[error]Failed to resolve latest Supabase CLI release:
      #            rate limit exceeded
      #
      # Zarari deploy bilan tugamadi. Oʻsha yugurish PR #13 ni
      # joylashi kerak edi; joylay olmagani uchun Edge Function butun
      # kun 35-versiyada qoldi va monopoliya bayrogʻi bazaga
      # yozilmadi. Yaʼni bitta API chegarasi butun bir kunlik
      # oʻlchovni yeb ketdi.
      #
      # Qotirilgan versiya bu soʻrovni umuman qilmaydi. 2.116.0 —
      # npm registrida `latest` deb belgilangan barqaror versiya
      # (tekshirildi 2026-09-05). Yangilash — ongli qadam, tasodif
      # emas.
      - uses: supabase/setup-cli@v1
        with: { version: 2.116.0 }

      - name: Joylash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy selleros --project-ref "$PROJECT_REF"

      # "Joylandi" degani "javob beryapti" degani emas. Buni tekshirmasak,
      # buzuq versiya ham "muvaffaqiyatli deploy" bo'lib ko'rinadi.
      - name: Tirikligini tekshirish
        env:
          ANON: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$ANON" ]; then
            echo "::error::SUPABASE_ANON_KEY yo'q — deploy tekshirilmadi."
            exit 1
          fi
          javob=$(curl -sS --max-time 30 \
            -H "Authorization: Bearer $ANON" \
            "https://$PROJECT_REF.supabase.co/functions/v1/selleros/health")
          echo "$javob"
          echo "$javob" | grep -q '"ok": *true' || {
            echo "::error::/health javobi kutilganday emas."
            exit 1
          }
