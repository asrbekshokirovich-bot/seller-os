<!doctype html>
<!--
  Ijtimoiy tarmoq kartasi (Open Graph) rasmi — src/app/opengraph-image.png manbasi.
  Bosh sahifa hero si: tokenlar (.zs-mavzu, tungi), oʻzimizdagi Unbounded/Onest
  shriftlari — «oʻ», «gʻ» (U+02BB) saytdagi glif bilan bir xil.
  Qayta yasash: shu faylni Chrome da 1200×630 oynada oching (deviceScaleFactor 1),
  shriftlar yuklangach skrinshot oling (masalan Playwright `page.screenshot`) va
  natijani src/app/opengraph-image.png ga yozing. Matn oʻzgarsa — alt matn ham:
  src/app/opengraph-image.alt.txt.
-->
<html lang="uz">
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: 'Unbounded'; font-weight: 200 900; src: url('../public/fonts/unbounded-latin.woff2') format('woff2'); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
  @font-face { font-family: 'Unbounded'; font-weight: 200 900; src: url('../public/fonts/unbounded-latin-ext.woff2') format('woff2'); unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF; }
  @font-face { font-family: 'Onest'; font-weight: 100 900; src: url('../public/fonts/onest-latin.woff2') format('woff2'); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
  @font-face { font-family: 'Onest'; font-weight: 100 900; src: url('../public/fonts/onest-latin-ext.woff2') format('woff2'); unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF; }
  @font-face { font-family: 'Onest'; font-weight: 100 900; src: url('../public/fonts/onest-math.woff2') format('woff2'); unicode-range: U+2190, U+2192, U+2194-21AE; }
  html, body { margin: 0; }
  body {
    width: 1200px; height: 630px; overflow: hidden; box-sizing: border-box;
    background: #13100c; color: #f4efe6; font-family: 'Onest', sans-serif;
    -webkit-font-smoothing: antialiased;
    padding: 64px 80px; display: flex; flex-direction: column;
  }
  .logo { display: flex; align-items: center; gap: 14px; font-family: 'Unbounded'; font-weight: 600; font-size: 30px; letter-spacing: -0.03em; }
  .nishon { width: 56px; height: 56px; border-radius: 19px; background: #e86e42; color: #fff; display: inline-flex; align-items: center; justify-content: center; font-family: 'Unbounded'; font-weight: 700; font-size: 25px; letter-spacing: 0; }
  .kicker { margin-top: 44px; align-self: flex-start; display: inline-flex; align-items: center; gap: 10px; height: 44px; padding: 0 18px; border-radius: 999px; background: rgba(232, 110, 66, 0.16); color: #e86e42; font-size: 19px; font-weight: 600; }
  .nuqta { width: 9px; height: 9px; border-radius: 50%; background: #e86e42; }
  h1 { margin: 26px 0 0; font-family: 'Unbounded'; font-weight: 600; font-size: 56px; line-height: 1.1; letter-spacing: -0.045em; max-width: 1040px; text-wrap: balance; }
  .urgu { color: #e86e42; }
  .past { margin-top: auto; display: flex; justify-content: space-between; align-items: baseline; font-size: 21px; color: #afa595; }
  .past b { color: #f4efe6; font-weight: 600; }
</style>
</head>
<body>
  <div class="logo"><span class="nishon">Z</span>ZumSavdo</div>
  <div class="kicker"><span class="nuqta"></span>Guangzhou → Toshkent → Uzum</div>
  <h1>Bir dona tovarning doʻkoningizgacha yoʻli — <span class="urgu">besh bekat</span>, har birida raqam.</h1>
  <div class="past"><span>Uzumda nima sotishni raqamlar bilan tanlang</span><b>zumsavdo.vercel.app</b></div>
</body>
</html>
